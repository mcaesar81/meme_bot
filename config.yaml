mode: paper  # paper | real
loop_interval_sec: 3
state_stale_price_sec: 20
trade_wallet_overfund_pause_usd: 150

risk:
  max_trades_per_day: 20
  max_loss_per_day_usd: 30
  max_loss_per_hour_usd: 10
  max_position_usd: 5
  slippage_limit_bps: 250
  min_liquidity_usd: 10000
  min_volume_5m_usd: 5000
  trade_cooldown_sec: 20
  pause_duration_sec: 120

strategy:
  test_entry_usd: 2
  allow_scale_in: true
  max_position_usd: 5
  scale_in_step_usd: 1
  stop_loss_usd: 1
  stall_exit_sec: 75
  max_hold_sec: 480
  quick_profit_usd: 0.5
  quick_profit_partial_ratio: 0.5
  tighten_stall_after_quick_profit_sec: 30

wallets:
  vault_wallet_address: "REPLACE_VAULT_WALLET"
  trade_wallet_address: "REPLACE_TRADE_WALLET"
  trade_wallet_daily_allowance_usd: 50

providers:
  indexer:
    base_url: "https://REPLACE_INDEXER_ENDPOINT"
    universe_path: "/tokens/top"
    top_n: 25
    timeout_sec: 10
    api_key: ""
  quote:
    base_url: "https://REPLACE_QUOTE_ENDPOINT"
    quote_path: "/quote"
    timeout_sec: 10
    api_key: ""

logging:
  events_path: "events.log"
  trades_path: "trades.jsonl"

state_store:
  runtime_state_path: "runtime_state.json"
